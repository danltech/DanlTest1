name: Daily DanlTechOS ISO Build

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: DanlTechOS Pacman Repository hinzufügen
        run: |
          echo -e "\n[danltechos]\nSigLevel = Optional TrustAll\nServer = https://danltech.github.io/danltechos-repo/x86_64" >> /etc/pacman.conf

      - name: DanlTechOS Repository-Schlüssel importieren
        run: |
          pacman-key --init
          pacman-key --populate archlinux

          curl -fsSL \
            https://danltech.github.io/danltechos-repo/x86_64/danltechos-repo-key.asc \
            -o /tmp/danltechos-repo-key.asc

          pacman-key --add /tmp/danltechos-repo-key.asc
          pacman-key --finger B3A28DD24056E9C0AB278B09820A40D57FD9C842
          pacman-key --lsign-key B3A28DD24056E9C0AB278B09820A40D57FD9C842

      - name: System updaten & Archiso installieren
        run: |
          pacman -Syu --noconfirm
          pacman -S archiso xorriso squashfs-tools --noconfirm

      - name: ISO bauen mit mkarchiso
        run: |
          mkdir -p /tmp/archiso-workspace
          mkdir -p /tmp/archiso-out
          mkarchiso -v -w /tmp/archiso-workspace -o /tmp/archiso-out .

      - name: ISO als Run Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: DanlTechOS-Daily-ISO
          path: /tmp/archiso-out/*.iso
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
